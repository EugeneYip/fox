# 型別檢查、建置、隱私稽核 —— 跟 deploy.yml 同一套關卡，但不部署。
#
# 分工（2026-09-06 改）：
#
#   deploy.yml  只在**會改到 dist/** 的路徑上跑（src/、public/、設定檔）
#   這一份      跑其餘的路徑（scripts/、docs/、根目錄那些檔案）
#
# 在那之前這一份**只在 PR 上觸發**，而這個專案是直接推 main、
# 一個 PR 都沒開過 —— 也就是說它幾乎沒有跑過，而每一次推都跑完整套部署。
# 現在兩份的 paths 是互補的：每一個 commit 都跑得到同一套關卡，
# 但只有真的會改到產出的才部署。
#
# 那個「互補」不是靠人記得：check:workflows 有一條 `path-uncovered`
# 在守「每一個進版控的頂層路徑，至少有一份 workflow 的 paths 認得它」。
name: 檢查

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - '.claude/**'
      - '*.md'
      - '.editorconfig'
      - '.env.example'
      - '.gitattributes'
      - '.gitignore'
      - '.npmrc'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 型別檢查
        run: npm run check

      - name: 對比度（WCAG，深淺兩套都算）
        run: npm run check:contrast

      - name: 建置
        run: npm run build

      # PRIVACY_NEEDLES 是要搜尋的個資字串（本名、校名⋯⋯），一行一個。
      # 值不能寫在 repo 裡 —— 那正是這道檢查要防的事。設成 repo secret。
      # 沒設的話 audit 仍然會跑，但會明講「身分規則沒有執行」。
      #
      # 排在建置**之後**：這一支有 10 條規則讀的是 dist/（零第三方請求、
      # 四條 CSP、cookie 承諾⋯⋯）。第 7 輪（第四十一圈）量到它原本排在建置
      # 之前，於是那 10 條在 CI 上一次都沒跑過 —— 而本機永遠有 dist，所以看不出來。
      - name: 隱私稽核（有硬編碼的個資就擋下來，要有 dist/ 才驗得到那 10 條）
        run: npm run audit:privacy
        env:
          PRIVACY_NEEDLES: ${{ secrets.PRIVACY_NEEDLES }}

      - name: 無障礙靜態檢查（要有 dist/ 才能跑，所以排在建置之後）
        run: npm run check:a11y

      - name: 效能預算（同樣需要 dist/）
        run: npm run check:perf

      # 這一步不算在「六道關卡」裡（verify:all 沒有它）。
      # 它測的是同步腳本對別人伺服器的禮貌 —— 主機間隔與 Retry-After，
      # 跟網站本身正不正確無關，但改壞了不會有任何地方報錯，所以要有人看著。
      # 這裡的順序沒問題（排在建置之後），但還是分成兩步，
      # 跟 deploy.yml 一致 —— 兩份檔案用同一組 script 名稱，
      # 以後有人動其中一個時比較不會漏掉另一個。
      - name: 工具的單元測試（不算在六道關卡裡）
        run: npm run test:units

      - name: 產出的檢查（文案慣例、內容管線）
        run: npm run test:built
